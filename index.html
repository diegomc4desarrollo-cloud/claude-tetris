<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-bar">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-toggle" for="theme-switch" title="Cambiar tema claro/oscuro">
        <input type="checkbox" id="theme-switch" />
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb"></span>
        </span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section panel-section-next">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="touch-controls" class="touch-controls" role="group" aria-label="Controles táctiles">
      <div class="touch-group">
        <button type="button" class="touch-btn" data-action="left" aria-label="Mover izquierda">◀</button>
        <button type="button" class="touch-btn" data-action="down" aria-label="Bajar">▼</button>
        <button type="button" class="touch-btn" data-action="right" aria-label="Mover derecha">▶</button>
      </div>
      <div class="touch-group">
        <button type="button" class="touch-btn" data-action="rotate" aria-label="Rotar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
        </button>
        <button type="button" class="touch-btn" data-action="drop" aria-label="Caída instantánea">⤓</button>
        <button type="button" class="touch-btn" data-action="pause" aria-label="Pausar">⏸</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
